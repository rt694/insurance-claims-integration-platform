[project]
name = "claim-summary-worker"
version = "0.1.0"
description = "Reviewer-assistance worker for synthetic insurance claims"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=10.0,<11.0",
    "fastapi>=0.116,<1.0",
    "openai>=3.8,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "prometheus-client>=0.22,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12,<3.0",
    "mypy>=1.17,<2.0",
    "pytest>=8.4,<10.0",
    "pytest-cov>=6.2,<8.0",
    "ruff>=0.12,<1.0",
    "testcontainers[rabbitmq]>=4.13,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claim_summary_worker"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=claim_summary_worker --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
    "integration: requires a Docker-compatible container runtime",
]

[tool.coverage.run]
branch = true
source = ["claim_summary_worker"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
