spring:
  application:
    name: claims-service
  datasource:
    url: ${CLAIMS_DB_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${CLAIMS_DB_USERNAME:claims_app}
    password: ${CLAIMS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:claims_app}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 10
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  application:
    name: Claims Service
    description: Insurance claims intake and orchestration service

integration:
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    batch-size: 25
    poll-interval: 1s
    lease-duration: 15s
    retry-delay: 5s
    confirm-timeout: 5s
  summary-consumer:
    enabled: ${SUMMARY_CONSUMER_ENABLED:true}
    max-attempts: 3
    retry-delay: 5s
    confirm-timeout: 5s
  dead-letter-replay:
    enabled: ${DEAD_LETTER_REPLAY_ENABLED:false}
    max-batch-size: 100
  policy:
    base-url: ${POLICY_SERVICE_BASE_URL:http://localhost:8082}
    connect-timeout: 1s
    read-timeout: 2s
    retry:
      max-attempts: 3
      wait-duration: 200ms
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-number-of-calls: 5
      wait-duration-in-open-state: 10s
