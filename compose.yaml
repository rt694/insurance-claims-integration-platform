services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${CLAIMS_DB_NAME:-claims}
      POSTGRES_USER: ${CLAIMS_DB_USERNAME:-claims_app}
      POSTGRES_PASSWORD: ${CLAIMS_DB_PASSWORD:?Set CLAIMS_DB_PASSWORD in a local .env file}
    ports:
      - "5432:5432"
    volumes:
      - claims-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-claims_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in a local .env file}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - claims-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in a local .env file}
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_AGENT_USERNAME: ${KEYCLOAK_AGENT_USERNAME:-claims-agent}
      KEYCLOAK_AGENT_PASSWORD: ${KEYCLOAK_AGENT_PASSWORD:?Set KEYCLOAK_AGENT_PASSWORD in a local .env file}
      KEYCLOAK_REVIEWER_USERNAME: ${KEYCLOAK_REVIEWER_USERNAME:-claims-reviewer}
      KEYCLOAK_REVIEWER_PASSWORD: ${KEYCLOAK_REVIEWER_PASSWORD:?Set KEYCLOAK_REVIEWER_PASSWORD in a local .env file}
      KEYCLOAK_ADMIN_USER_USERNAME: ${KEYCLOAK_ADMIN_USER_USERNAME:-claims-admin}
      KEYCLOAK_ADMIN_USER_PASSWORD: ${KEYCLOAK_ADMIN_USER_PASSWORD:?Set KEYCLOAK_ADMIN_USER_PASSWORD in a local .env file}
    ports:
      - "8090:8080"
    volumes:
      - ./infrastructure/keycloak/insurance-platform-realm.json:/opt/keycloak/data/import/insurance-platform-realm.json:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          IFS= read -r status <&3 &&
          [[ "$$status" == *"200 OK"* ]]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 120s
    restart: unless-stopped

  policy-service:
    build:
      context: .
      dockerfile: services/policy-service/Dockerfile
    ports:
      - "8082:8082"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8082/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  claims-service:
    build:
      context: services/claims-service
    environment:
      CLAIMS_DB_URL: jdbc:postgresql://postgres:5432/${CLAIMS_DB_NAME:-claims}
      CLAIMS_DB_USERNAME: ${CLAIMS_DB_USERNAME:-claims_app}
      CLAIMS_DB_PASSWORD: ${CLAIMS_DB_PASSWORD:?Set CLAIMS_DB_PASSWORD in a local .env file}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-claims_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in a local .env file}
      POLICY_SERVICE_BASE_URL: http://policy-service:8082
      CLAIMS_JWT_ISSUER_URI: ${CLAIMS_JWT_ISSUER_URI:-http://localhost:8090/realms/insurance-platform}
      CLAIMS_JWT_JWK_SET_URI: http://keycloak:8080/realms/insurance-platform/protocol/openid-connect/certs
      CLAIMS_JWT_AUDIENCE: ${CLAIMS_JWT_AUDIENCE:-claims-service}
      CLAIMS_CORS_ALLOWED_ORIGINS: ${CLAIMS_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      policy-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/actuator/health
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  claim-summary-worker:
    build:
      context: services/claim-summary-worker
    environment:
      CLAIM_SUMMARY_WORKER_ENVIRONMENT: local-compose
      CLAIM_SUMMARY_WORKER_RABBITMQ_ENABLED: "true"
      CLAIM_SUMMARY_WORKER_RABBITMQ_HOST: rabbitmq
      CLAIM_SUMMARY_WORKER_RABBITMQ_PORT: 5672
      CLAIM_SUMMARY_WORKER_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-claims_app}
      CLAIM_SUMMARY_WORKER_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in a local .env file}
      CLAIM_SUMMARY_WORKER_SUMMARY_PROVIDER: mock
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
      claims-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8083/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  claims-portal:
    build:
      context: services/claims-portal
      args:
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:8090/realms/insurance-platform}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-claims-portal}
    ports:
      - "5173:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      claims-service:
        condition: service_healthy
      claim-summary-worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/health
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  claims-postgres-data:
  claims-rabbitmq-data:
